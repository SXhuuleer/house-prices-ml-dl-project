paths:
  train: "data/raw/train.csv"
  test: "data/raw/test.csv"
  submission: "artifacts/submissions/catboost_refactored_submission.csv"

target:
  name: "SalePrice"
  log_transform: true

model:
  name: "catboost"
  params:
    iterations: 1000
    depth: 5
    learning_rate: 0.03
    l2_leaf_reg: 3
    random_seed: 42
    verbose: 0

experiments:
  models:
    - name: linear_regression
      params: {}

    - name: ridge
      params:
        alpha: 10.0

    - name: lasso
      params:
        alpha: 0.001
        max_iter: 10000

    - name: elasticnet
      params:
        alpha: 0.001
        l1_ratio: 0.5
        max_iter: 10000

    - name: decision_tree
      params:
        max_depth: 7
        min_samples_split: 10
        min_samples_leaf: 2
        max_features: null
        criterion: absolute_error
        random_state: 42

    - name: random_forest
      params:
        n_estimators: 300
        min_samples_leaf: 2
        random_state: 42
        n_jobs: -1

    - name: xgboost
      params:
        n_estimators: 700
        max_depth: 3
        learning_rate: 0.05
        min_child_weight: 1
        subsample: 0.8
        colsample_bytree: 0.7
        random_state: 42
        objective: "reg:squarederror"
        n_jobs: -1

    - name: lightgbm
      params:
        n_estimators: 700
        num_leaves: 63
        max_depth: 3
        learning_rate: 0.03
        min_child_samples: 30
        subsample: 0.8
        colsample_bytree: 0.7
        random_state: 42
        verbose: -1


cv:
  n_splits: 5
  random_state: 42

tuning:
  enabled: false
  n_iter: 5
  n_splits: 3

  models:
    - name: random_forest
      params:
        n_estimators: [100, 200, 300]
        max_depth: [10, 20, null]
        min_samples_split: [2, 5, 10]
        min_samples_leaf: [1, 2, 4]
        max_features: ["sqrt", 0.5, 1.0]
        random_state: [42]

    - name: decision_tree
      params:
        max_depth: [5, 7, 10, null]
        min_samples_split: [2, 5, 10]
        min_samples_leaf: [1, 2, 4]
        criterion: ["squared_error", "absolute_error"]
        random_state: [42]

    - name: xgboost
      params:
        n_estimators: [400, 700, 1000]
        max_depth: [2, 3, 4]
        learning_rate: [0.03, 0.05, 0.08]
        min_child_weight: [1, 3, 5]
        subsample: [0.7, 0.8, 1.0]
        colsample_bytree: [0.7, 0.85, 1.0]
        random_state: [42]
        n_jobs: [1]

    - name: lightgbm
      params:
        n_estimators: [400, 700, 1000]
        num_leaves: [15, 31, 63]
        max_depth: [3, 5, -1]
        learning_rate: [0.02, 0.03, 0.05]
        min_child_samples: [10, 20, 30]
        colsample_bytree: [0.7, 0.85, 1.0]
        random_state: [42]
        verbose: [-1]
        n_jobs: [1]

nested_cv:
  enabled: false

  models:
    - random_forest

  n_iter: 5
  outer_splits: 5
  inner_splits: 3

outliers:
  enabled: false
  area_threshold: 4000
  price_threshold: 300000

deep_learning:
  enabled: false
  epochs: 20
  batch_size: 32
  learning_rate: 0.003

feature_engineering:
  enabled: false

interaction_features:
  enabled: false

ensembles:
  enabled: false

  models:
    - catboost
    - xgboost
    - lightgbm

  experiments:
    - name: averaging
      weights: null

    - name: weighted_averaging
      weights: [0.5, 0.3, 0.2]

stacking:
  enabled: false
  ridge_alpha: 0.1
  inner_splits: 5